services:
  patito-judge-kernel:
    build: .
    container_name: patito-judge-kernel
    restart: always
    labels:
      - traefik.enable=true
    user: judge
    environment:
      LANG: "es_ES.UTF-8"
      HOME: "/home/judge"
      CONF: "/home/judge/etc/judge.conf"
    tty: true
    volumes:
      - ../storage:/home/judge
    networks:
      - traefik-net
      - traefik-internal

networks:
  traefik-net:
    external: true
  traefik-internal:
    external: false
